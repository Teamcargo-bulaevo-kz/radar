plugins {
    id 'com.android.application'
}

android {
    namespace 'kz.bulaevo.radar'
    compileSdk 34

    defaultConfig {
        applicationId 'kz.bulaevo.radar'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        // Нейросеть (TensorFlow Lite) — только для процессоров телефонов и x86_64 для эмулятора.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // Один и тот же ключ для всех сборок: новую версию можно ставить поверх старой без удаления.
    signingConfigs {
        radar {
            storeFile file('radar.keystore')
            storePassword 'radar-sonar'
            keyAlias 'radar'
            keyPassword 'radar-sonar'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.radar
        }
        release {
            signingConfig signingConfigs.radar
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Нейросеть глубины (вкладка «Глубина»). Сама модель скачивается приложением, в APK её нет.
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    testImplementation 'junit:junit:4.13.2'
}
